spring.application.name=api

#solo quiero ver que cale
spring.config.import=optional:file:.env[.properties],optional:file:backend/api/.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Host base de datos
spring.datasource.url=${DATABASE_URL}

# Username Base de datos
spring.datasource.username=${DATABASE_USERNAME}

# Password base de datos
spring.datasource.password=${DATABASE_PASSWORD}

# Driver de conexion
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Dialecto de base de datos (opcional, lo detecta hibernate)
# spring.jpa.database-platform= org.hibernate.dialect.MySQLDialect

# Hacer que spring boot no modifique la base de datos
spring.jpa.hibernate.ddl-auto=none

# Controla cuanto tiempo permanece abierta la conexión de hibernate
#spring.jpa.open-in-view=false


app.cookie.refresh-name=refreshToken

app.cookie.path=/api/auth

app.cookie.same-site=Lax

app.cookie.secure=true


# Valores para JWT 
# Secret key
security.jwt.secret-key=${JWT_Key}

# Fecha de expiración
security.jwt.expiration-time=${JWT_expiration}

# Expiracion token refresh (cookies en un futuro)
security.jwt.refresh-expiration-time=${JWT_refresh_expiration}


# Valores para actuator, solo muestra health
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

