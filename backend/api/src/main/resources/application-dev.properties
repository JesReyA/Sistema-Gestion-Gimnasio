# Ayuda a importar variables desde el .env

# Mostrar consultas sql en consola
spring.jpa.show-sql=true

# Dar formato a sql en consola/terminal
spring.jpa.properties.hibernate.format_sql=true

# Comprueba que coincidan las entidades
spring.jpa.hibernate.ddl-auto=validate

# Se agregó para usar refresh por medio de cookies en un futuro
app.cookie.secure=false

# Activa swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# Detaelles health en dev
management.endpoint.health.show-details=always